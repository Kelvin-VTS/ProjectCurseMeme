name: Ingest uploaded media

# 浏览器上传页用 PAT 把原文件推到 staging/<批次> 分支，这个 workflow 负责：
#   1. 取出原文件
#   2. 跑 process-media.ts（runner 自带 ffmpeg，能转 HEVC）
#   3. 重建 manifest.json / rankings.json
#   4. 把成品提交到 main，删掉临时分支
#   5. 触发 Pages 重新部署
on:
  push:
    branches: ['staging/**']
  workflow_dispatch:

permissions:
  contents: write # 提交到 main、删除 staging 分支
  actions: write # 提交后触发 Pages 重新部署（GITHUB_TOKEN 的提交不会自动触发下游 workflow）

# 同一时刻只处理一批。两个批次同时往 main 推会互相顶掉，所以这里排队而不是取消。
concurrency:
  group: ingest-main
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # 用 git archive 而不是 git checkout <分支> -- incoming：
      # 前者不会动索引，后面 git add -A 不会把 incoming/ 的删除动作留在提交里。
      - name: 取出本批上传的原始素材
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH"
          git archive FETCH_HEAD incoming | tar -x -C .
          echo "本批文件："
          ls -lh incoming

      - name: 安装工具链依赖
        run: npm ci

      - name: 处理素材并重建索引
        run: node scripts/ingest-batch.mjs

      # 不再把「没有变更」当成失败：全部文件都已在库（哈希查重命中）是正常的空操作，
      # 之前一律报红，把用户坑过一次。真正的处理失败由 ingest-batch 自己以非零退出表达。
      - name: 检查是否有产物
        id: check
        run: |
          set -uo pipefail
          rm -rf incoming
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "本批没有新增内容（这些文件此前已入库）"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "待提交的文件："
            git diff --cached --stat
          fi

      - name: 提交到 main
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "ingest: 处理上传素材（$BRANCH）"
          git push origin HEAD:main

      # 走到这里说明处理没出硬错误，临时分支就清掉（包括空操作那批）。
      # 只有 ingest 步骤本身失败时 workflow 会中断，分支才会留下供排查。
      - name: 删除临时分支
        run: git push origin --delete "$BRANCH"

      # 用 GITHUB_TOKEN 产生的提交不会触发下游 workflow，
      # 但 workflow_dispatch 是官方文档里明确的例外，所以显式戳一下部署。
      - name: 触发 Pages 重新部署
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
