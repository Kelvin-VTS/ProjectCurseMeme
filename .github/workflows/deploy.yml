name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要这三项权限；id-token 用于 OIDC 部署
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      - name: 构建
        working-directory: web
        env:
          # 项目站点的子路径，直接取仓库名，不用手改
          VITE_BASE: /${{ github.event.repository.name }}/
          # 媒体放在仓库根 media/，不进 Pages 产物，否则几百 MB 素材会顶到
          # 「已发布站点 ≤1GB」的天花板。线上统一从 CDN 读。
          #
          # 用 jsDelivr 而不是 raw.githubusercontent.com，是实测决定的：
          # raw 在国内经常超时（本机实测 25 秒无响应），jsDelivr 1.5 秒返回。
          # 注意 jsDelivr 对 GitHub 源有 20MB 单文件上限，管线会对此告警。
          VITE_MEDIA_BASE: https://cdn.jsdelivr.net/gh/${{ github.repository }}@main
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
