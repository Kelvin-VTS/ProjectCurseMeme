name: Ingest issue submission

# 访客投稿路线：访客用**自己的 GitHub 账号**开一个投稿 Issue，不需要任何令牌。
# 这个 workflow 负责把附件取下来、用现成管线处理，然后开一个**草稿 PR** 交给站长审核。
# 合并才上线；关闭 PR 就等于拒稿（素材不会进 main）。
#
# 安全要点：正文标题等都是用户可控内容，一律由 scripts/ingest-issue.mjs 落成文件，
# 这里绝不出现 ${{ github.event.issue.* }} —— 标题里带个引号就能击穿 shell 拼接。
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write # 推 submit/issue-<n> 分支
  pull-requests: write # 开草稿 PR
  issues: write # 回评

concurrency:
  group: ingest-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  stage:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    env:
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 解析投稿并下载附件
        id: parse
        run: node scripts/ingest-issue.mjs

      - name: 安装工具链依赖
        if: steps.parse.outputs.status == 'ok'
        run: npm ci

      - name: 处理素材并重建索引
        if: steps.parse.outputs.status == 'ok'
        run: node scripts/ingest-batch.mjs

      - name: 检查是否有产物
        id: check
        if: steps.parse.outputs.status == 'ok'
        run: |
          set -uo pipefail
          rm -rf incoming
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "本批没有新增内容（这些文件此前已入库）"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: 把处理结果补进回评与 PR 正文
        if: steps.parse.outputs.status == 'ok'
        run: |
          set -uo pipefail
          if [ -f .cache/ingest-report.json ]; then
            node -e "
              const r = require('./.cache/ingest-report.json');
              const line = '\n处理结果：入库 ' + r.totals.added + '，跳过（已存在）' + r.totals.skipped + '，失败 ' + r.totals.failed + '\n';
              require('fs').appendFileSync('.cache/issue-comment.md', line);
              require('fs').appendFileSync('.cache/pr-body.md', '\n' + line);
            "
          fi
          if [ "${CHANGED}" = "false" ]; then
            printf '\n这批素材此前都已入库，没有产生新内容，也就没有 PR 需要审核。\n' >> .cache/issue-comment.md
          fi
        env:
          CHANGED: ${{ steps.check.outputs.changed }}

      # 这一步以前失败过却没有留下任何原因（gh 的报错被吞了）。
      # 现在每一步都单独捕获 stderr，失败就打成 ::error:: 注解，
      # 并且 gh 建 PR 失败时会改用 REST API 再试一次。
      - name: 推分支并开草稿 PR
        if: steps.parse.outputs.status == 'ok' && steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          BRANCH="submit/issue-$ISSUE"
          TITLE="$(cat .cache/issue-title.txt)"
          AUTHOR="$(cat .cache/issue-author.txt)"
          printf '投稿(#%s)：%s' "$ISSUE" "$TITLE" > .cache/pr-title.txt

          git config user.name  "cursememe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git checkout -b "$BRANCH" 2>.cache/step-error.txt; then
            echo "::error::创建分支失败：$(cat .cache/step-error.txt)"; exit 1
          fi
          git add -A
          if ! git commit -q --author="$AUTHOR <$AUTHOR@users.noreply.github.com>" -m "投稿(#$ISSUE)：$TITLE" 2>.cache/step-error.txt; then
            echo "::error::提交失败：$(cat .cache/step-error.txt)"; exit 1
          fi
          if ! git push -f origin "$BRANCH" 2>.cache/step-error.txt; then
            echo "::error::推送分支失败：$(cat .cache/step-error.txt)"; exit 1
          fi

          # 已经开过 PR（例如投稿人改了 Issue 触发重跑）就复用
          if EXISTING="$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json url -q .url 2>/dev/null)" && [ -n "$EXISTING" ]; then
            printf '\n草稿 PR 已更新（这条 Issue 之前已经开过 PR）：%s\n' "$EXISTING" >> .cache/issue-comment.md
            exit 0
          fi

          if gh pr create --draft --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
               --title "$(cat .cache/pr-title.txt)" --body-file .cache/pr-body.md \
               > .cache/pr-url.txt 2>.cache/step-error.txt; then
            printf '\n草稿 PR：%s\n\n站长审核合并后才会正式上线。\n' "$(cat .cache/pr-url.txt)" >> .cache/issue-comment.md
            exit 0
          fi

          # gh 失败就退回 REST API —— 两条独立路径，避免卡死在这一步
          echo "::warning::gh pr create 失败，改用 REST API 重试：$(cat .cache/step-error.txt)"
          node -e "
            const fs = require('fs');
            fs.writeFileSync('.cache/pr-payload.json', JSON.stringify({
              title: fs.readFileSync('.cache/pr-title.txt', 'utf8'),
              head: process.env.BRANCH,
              base: 'main',
              draft: true,
              body: fs.readFileSync('.cache/pr-body.md', 'utf8'),
            }));
          "
          if curl -sS -f -X POST \
               -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls" \
               --data-binary @.cache/pr-payload.json -o .cache/pr-response.json 2>.cache/step-error.txt; then
            printf '\n草稿 PR：%s\n\n站长审核合并后才会正式上线。\n' \
              "$(node -e "console.log(require('./.cache/pr-response.json').html_url)")" >> .cache/issue-comment.md
          else
            echo "::error::建 PR 失败（gh 和 REST API 都没成）：$(cat .cache/step-error.txt) $(head -c 300 .cache/pr-response.json 2>/dev/null)"
            exit 1
          fi

      - name: 回评 Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -s .cache/issue-comment.md ]; then
            gh issue comment "$ISSUE" --body-file .cache/issue-comment.md \
              || echo "回评失败（可能权限不足），但不影响已完成的处理"
          else
            echo "没有生成回评内容（可能不是投稿类 Issue），跳过"
          fi
